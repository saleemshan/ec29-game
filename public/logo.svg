<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Ec99 Game logo">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0F4B2E"/>
      <stop offset="70%" stop-color="#06301B"/>
      <stop offset="100%" stop-color="#031A0F"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE48A"/>
      <stop offset="50%" stop-color="#E8A41A"/>
      <stop offset="100%" stop-color="#B97D0F"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE48A"/>
      <stop offset="55%" stop-color="#FFC23C"/>
      <stop offset="100%" stop-color="#B97D0F"/>
    </linearGradient>
    <radialGradient id="gem" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF8AA0"/>
      <stop offset="100%" stop-color="#B70F2A"/>
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- outer ring -->
  <circle cx="256" cy="256" r="248" fill="url(#ring)"/>
  <circle cx="256" cy="256" r="232" fill="#0B1027"/>

  <!-- inner gold border -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#ring)" stroke-width="6"/>

  <!-- inner background -->
  <circle cx="256" cy="256" r="210" fill="url(#bg)"/>

  <!-- crown -->
  <g transform="translate(256 110)" fill="url(#ring)" stroke="#7A4F08" stroke-width="2">
    <path d="M-72 0 L-48 -34 L-24 -10 L0 -42 L24 -10 L48 -34 L72 0 L60 28 L-60 28 Z"/>
    <circle cx="-48" cy="-34" r="6" fill="url(#gem)"/>
    <circle cx="0" cy="-42" r="8" fill="url(#gem)"/>
    <circle cx="48" cy="-34" r="6" fill="url(#gem)"/>
  </g>

  <!-- decorative side flourishes -->
  <g fill="url(#ring)" opacity="0.85">
    <path d="M70 256 Q110 220 150 256 Q110 292 70 256 Z"/>
    <path d="M442 256 Q402 220 362 256 Q402 292 442 256 Z"/>
  </g>

  <!-- card-suit dots row (subtle nod to source logo) -->
  <g fill="#FFC23C" opacity="0.85" transform="translate(256 178)">
    <circle cx="-72" cy="0" r="6"/>
    <circle cx="-36" cy="0" r="6"/>
    <circle cx="0" cy="0" r="6"/>
    <circle cx="36" cy="0" r="6"/>
    <circle cx="72" cy="0" r="6"/>
  </g>

  <!-- main wordmark -->
  <text
    x="256"
    y="290"
    text-anchor="middle"
    font-family="Bebas Neue, Impact, Arial Black, sans-serif"
    font-size="148"
    font-weight="900"
    fill="url(#text)"
    stroke="#7A4F08"
    stroke-width="3"
    letter-spacing="4"
  >EC99</text>

  <!-- bottom flourish gem -->
  <g transform="translate(256 380)">
    <path d="M-44 0 L-22 -22 L0 -10 L22 -22 L44 0 L22 22 L0 10 L-22 22 Z" fill="url(#ring)" stroke="#7A4F08" stroke-width="2"/>
    <circle cx="0" cy="0" r="9" fill="url(#gem)"/>
  </g>

  <!-- subtle laurel arcs -->
  <g fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.55">
    <path d="M120 340 Q256 430 392 340"/>
    <path d="M140 360 Q256 450 372 360" opacity="0.4"/>
  </g>
</svg>
